# Portable Codex behavior defaults.
# Provider, authentication, MCP, runtime, model, and model-catalog settings
# remain managed by the active provider configuration.
# Ultra and Fast require support from the selected model and provider.

model_reasoning_effort = "ultra"
service_tier = "fast"
personality = "pragmatic"

disable_response_storage = true
check_for_update_on_startup = true

[desktop]
followUpQueueMode = "queue"
show-context-window-usage = true

[features]
# Core capabilities
goals = true
fast_mode = true
enable_request_compression = true
shell_snapshot = true
memories = true

# Agent and plugin capabilities
multi_agent = true
recommended_plugins = true

# Experimental: prevent sleep while a Codex turn is running.
prevent_idle_sleep = true

# V2 concurrency includes the main thread:
# 15 total threads = 1 main thread + up to 14 sub-agents.
[features.multi_agent_v2]
enabled = true
max_concurrent_threads_per_session = 15

[agents]
enabled = true

# Used when the spawn request does not specify an effort.
# Explicit settings or V2 inheritance may override it.
default_subagent_reasoning_effort = "medium"
interrupt_message = true

[memories]
generate_memories = true
use_memories = true

# Skip background memory generation below 20% remaining capacity.
min_rate_limit_remaining_percent = 20

[windows]
sandbox = "elevated"
